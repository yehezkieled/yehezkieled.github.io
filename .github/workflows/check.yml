name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check site scripts
        run: |
          for f in content.js assets/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Plain page is in sync with content.js
        run: |
          node scripts/render-plain.mjs
          git diff --exit-code -- plain/index.html
